[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/oca-addons
db_host = db
db_port = 5432
db_name = Famoil
db_user = odoo
; db_password is injected at runtime via the PASSWORD env var (docker-compose.yml)
; Never hardcode a password here — set it in .env
data_dir = /var/lib/odoo
; admin_passwd is injected at runtime via the ADMIN_PASSWD env var (docker-compose.yml)
; Never hardcode a password here — set ODOO_ADMIN_PASSWD in .env

; Worker config — suitable for a single-server VPS (2–4 vCPU)
; Set workers = 0 for single-process mode (easier debugging)
workers = 2
max_cron_threads = 1

log_level = info
logfile = /var/log/odoo/odoo.log

; Security
list_db = False
proxy_mode = True

; Performance
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
