name: Secret and Credential Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          FAILED=0
          PATTERNS=(
            "password\s*="
            "passwd\s*="
            "db_password"
            "ANTHROPIC_API_KEY\s*="
            "SECRET_KEY\s*="
            "-----BEGIN.*PRIVATE KEY-----"
          )
          for pattern in "${PATTERNS[@]}"; do
            # Exclusions (all applied to the grep output lines, format: "file:line:content"):
            #   1. Test/placeholder markers — not real credentials
            #   2. Comment lines in .conf/.ini/.sh files (content starts with ; or #)
            #      e.g. "; db_password is injected at runtime" in odoo.conf
            #   3. Shell variable references (${...}) — value is injected at runtime,
            #      not hardcoded; e.g. `printf 'admin_passwd = %s\n' "${VAR}"`
            #   4. printf format strings (%s) — same reason as (3)
            #   5. CHANGE_ME placeholders in .env.example files
            HITS=$(grep -rn --include="*.py" --include="*.sh" \
                   --include="*.conf" --include="*.json" --include="*.env" \
                   -i "$pattern" . \
                   --exclude-dir=".git" \
                   --exclude-dir="backups" \
                   --exclude="local_secret_scan.sh" 2>/dev/null \
                   | grep -v "test_password\|dummy_password\|CHANGE_ME" \
                   | grep -Ev "^[^:]+:[0-9]+:[[:space:]]*(;|#)" \
                   | grep -v '\${' \
                   | grep -Ev "printf[^|]*%s|%s[^|]*printf" \
                   || true)
            if [ -n "$HITS" ]; then
              echo "SECURITY VIOLATION — pattern '$pattern' found:"
              echo "$HITS"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "Security scan FAILED. Remove credentials before merging."
            exit 1
          fi
          echo "Security scan PASSED."
